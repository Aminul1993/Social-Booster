# Install once:   pip install pre-commit && pre-commit install
# Run manually:   pre-commit run --all-files
# The project lives in Social-Booster/; ruff and black pick up its
# pyproject.toml automatically, mypy runs from that directory.
default_language_version:
  python: python3.12

files: ^(Social-Booster/|\.github/|\.pre-commit-config\.yaml$)
exclude: ^Social-Booster/(static/vendor/|uploads/|data/|\.venv/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^Social-Booster/

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.0
    hooks:
      - id: black
        files: ^Social-Booster/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        language: system
        entry: bash -c 'cd Social-Booster && python -m mypy app services tests scripts gunicorn.conf.py'
        pass_filenames: false
        files: ^Social-Booster/.*\.py$
